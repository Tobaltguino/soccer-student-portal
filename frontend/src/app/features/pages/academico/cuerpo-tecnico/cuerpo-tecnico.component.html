<div class="pf-admin-wrapper fadein animation-duration-500">
    
    <p-toast position="top-right"></p-toast>

    <header class="pf-admin-header">
        <div class="header-content">
            <div>
                <h1 class="pf-anton text-chalk m-0 text-3xl">Cuerpo Técnico</h1>
                <p class="pf-oswald text-teal mt-1">Entrenadores y profesionales encargados de tu grupo.</p>
            </div>
        </div>
        <div class="header-actions">
            <button pButton icon="pi pi-sync" class="pf-btn-ghost" 
                    (click)="cargarCuerpoTecnico()" [loading]="loading" pTooltip="Actualizar" tooltipPosition="left"></button>
        </div>
    </header>

    <!-- ESTADO DE CARGA -->
    <div *ngIf="loading" class="flex justify-content-center align-items-center p-6">
        <div class="pf-spinner"></div>
    </div>

    <!-- ESTADO DE ERROR -->
    <div *ngIf="errorMessage && !loading" class="p-4 border-round mb-4 border-1 surface-border flex align-items-center" style="background: rgba(255, 92, 92, 0.1); border-color: var(--neon-red) !important; color: var(--neon-red);">
        <i class="pi pi-exclamation-circle mr-3 text-2xl"></i> 
        <span class="pf-oswald text-lg pf-tracking-label">{{ errorMessage }}</span>
    </div>

    <!-- GRID DE PROFESORES -->
    <div class="grid" *ngIf="!loading && !errorMessage">
        
        <!-- Tarjeta responsive: Ocupa 12 columnas en móvil, 6 en tablet, 4 en pantallas grandes -->
        <div class="col-12 md:col-6 xl:col-4" *ngFor="let prof of profesores">
            
            <div class="pf-admin-card h-full flex align-items-center gap-4 transition-all transition-duration-200 hover:border-blue-500">
                
                <!-- AVATAR -->
                <div class="flex-shrink-0">
                    <img *ngIf="prof['foto_url']" [src]="prof['foto_url']" 
                         class="border-circle border-2 pf-border" 
                         style="width: 70px; height: 70px; object-fit: cover;" 
                         alt="Foto de {{prof.nombre}}">
                    
                    <div *ngIf="!prof['foto_url']" 
                         class="flex align-items-center justify-content-center border-circle border-2 pf-anton text-3xl pf-border pf-tracking-wide" 
                         style="width: 70px; height: 70px; background: rgba(59, 130, 246, 0.1); color: var(--neon-blue);">
                        {{ prof.nombre.charAt(0) }}{{ prof.apellido.charAt(0) }}
                    </div>
                </div>
                
                <!-- INFO DEL PROFESOR -->
                <div class="flex flex-column overflow-hidden w-full gap-2">
                    <h3 class="m-0 text-chalk pf-oswald text-xl" style="white-space: normal; word-break: break-word; line-height: 1.2;">
                        {{ prof.nombre }} {{ prof.apellido }}
                    </h3>
                    
                    <p-tag [value]="getEtiquetaRol(prof) | titlecase" 
                           severity="info" 
                           styleClass="w-max px-3" 
                           [style]="{'font-family': 'var(--pf-font-label)', 'letter-spacing': '0.05em'}"></p-tag>
                    
                    <span class="text-sm text-steel flex align-items-center pf-oswald mt-1" style="word-break: break-all;">
                        <i class="pi pi-envelope mr-2 text-teal"></i> 
                        {{ prof.email }}
                    </span>
                </div>

            </div>
        </div>
    </div>

    <!-- ESTADO VACÍO -->
    <div *ngIf="profesores.length === 0 && !loading && !errorMessage" class="text-center p-6 border-round border-1 surface-border mt-4 pf-bg-none pf-border">
        <i class="pi pi-users text-steel mb-3" style="font-size: 3.5rem;"></i>
        <p class="pf-oswald text-chalk text-xl m-0">Sin asignaciones</p>
        <span class="text-steel text-sm pf-oswald">No se encontraron profesores ni especialistas asignados a tu grupo.</span>
    </div>
    
</div>
