<div class="pf-admin-wrapper fadein animation-duration-500">
    <p-toast position="top-right"></p-toast>
    <p-confirmDialog [style]="{width: '450px'}" styleClass="pf-confirm-dialog"></p-confirmDialog>

    <header class="pf-admin-header">
        <div class="header-content">
            <div>
                <h1 class="pf-anton text-chalk m-0 text-3xl">Gestión de Grupos</h1>
                <p class="pf-oswald text-teal mt-1">Administra las categorías y equipos.</p>
            </div>
        </div>
        <div class="flex gap-2 w-full md:w-auto mt-3 md:mt-0">
            <button pButton pRipple icon="pi pi-file-excel" class="p-button-success flex-1 md:flex-none justify-content-center" label="Exportar" (click)="descargarExcel()" [disabled]="grupos.length === 0 || loading" pTooltip="Descargar catálogo de grupos" tooltipPosition="bottom"></button>
            <button pButton label="Nuevo Grupo" icon="pi pi-plus" class="pf-btn-primary flex-1 md:flex-none justify-content-center" (click)="abrirNuevo()"></button>
        </div>
    </header>

    <div class="pf-admin-card table-responsive p-0">
        <p-table [value]="grupos" [loading]="loading" [rows]="10" [paginator]="true" styleClass="p-datatable-sm pf-table" responsiveLayout="stack" [breakpoint]="'768px'">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 30%">Nombre</th>
                    <th style="width: 20%" class="text-center">Alumnos</th> 
                    <th style="width: 30%" class="hidden-mobile">Descripción</th>
                    <th style="width: 20%" class="text-center">Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-grupo>
                <tr>
                    <td>
                        <span class="p-column-title pf-oswald text-steel hidden-desktop">Nombre:</span>
                        <span class="pf-anton text-chalk" style="font-size: 16px; letter-spacing: 1px;">{{ grupo.nombre }}</span>
                        <div class="mobile-desc visible-mobile text-steel text-sm mt-1" *ngIf="grupo.descripcion">{{ grupo.descripcion }}</div>
                    </td>
                    
                    <td class="text-center">
                        <span class="p-column-title pf-oswald text-steel hidden-desktop">Alumnos:</span>
                        <p-tag [severity]="grupo.cantidad_alumnos > 0 ? 'success' : 'secondary'" 
                               [value]="grupo.cantidad_alumnos + (grupo.cantidad_alumnos === 1 ? ' Alumno' : ' Alumnos')"></p-tag>
                    </td>

                    <td class="hidden-mobile text-steel">{{ grupo.descripcion || 'Sin descripción' }}</td>
                    
                    <td class="text-center">
                        <span class="p-column-title pf-oswald text-steel hidden-desktop">Acciones:</span>
                        <div class="pf-table-actions">
                            <button pButton icon="pi pi-pencil" class="p-button-warning" 
                                    (click)="abrirEditar(grupo)" pTooltip="Editar Grupo"></button>
                            <button pButton icon="pi pi-trash" class="p-button-danger" 
                                    (click)="eliminarGrupo(grupo.id)" pTooltip="Eliminar Grupo"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="text-center p-5 text-steel">
                        <i class="pi pi-folder-open block mb-3 text-4xl"></i>
                        <span class="pf-oswald text-lg">No hay grupos creados aún.</span>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <!-- MODAL DE FORMULARIO -->
    <p-dialog [(visible)]="displayDialog" [header]="tituloDialogo" [modal]="true" [style]="{width: '90vw', maxWidth: '450px'}" styleClass="p-fluid pf-dialog" [closable]="!guardando" [draggable]="false" [resizable]="false">
        <ng-template pTemplate="content">
            <div class="flex flex-column pt-3">
                <div class="pf-field-group">
                    <label class="pf-oswald text-steel text-xs">Nombre del Grupo <span class="text-pink-500 font-bold">*</span></label>
                    <input pInputText [(ngModel)]="grupoForm.nombre" placeholder="Ej: Sub-17 A" [disabled]="guardando" />
                </div>
                <div class="pf-field-group">
                    <label class="pf-oswald text-steel text-xs">Descripción</label>
                    <textarea pTextarea [(ngModel)]="grupoForm.descripcion" rows="4" placeholder="Detalles opcionales..." [disabled]="guardando"></textarea>
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="footer">
            <button pButton label="Cancelar" icon="pi pi-times" class="pf-btn-ghost" (click)="displayDialog = false" [disabled]="guardando"></button>
            <button pButton label="Guardar" icon="pi pi-check" class="pf-btn-primary ml-2" (click)="guardarGrupo()" [loading]="guardando"></button>
        </ng-template>
    </p-dialog>

    <div class="pf-loading-overlay fadein" *ngIf="guardando">
        <div class="pf-spinner"></div>
        <div class="pf-loading-text">Guardando...</div>
    </div>
</div>
