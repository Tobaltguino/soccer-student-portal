<div class="layout-container" [class.collapsed]="isCollapsed">
    <div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
    
    <aside class="sidebar" [class.mobile-active]="isMobileMenuOpen">
        <div class="brand">
            <div class="logo-area">
                <div class="logo-icon">
                    <!-- 🔥 Intercambio de logos 🔥 -->
                    <img src="assets/logo-blanco.png" alt="Pro Fútbol" class="logo-dark" />
                    <img src="assets/logo-negro.png" alt="Pro Fútbol" class="logo-light" />
                </div>
                <div class="brand-text">
                    <h2 class="pf-anton">PRO FÚTBOL</h2>
                    <span class="pf-oswald">{{ userRole | uppercase }} PANEL</span>
                </div>
            </div>
            <button class="toggle-btn desktop-only" (click)="toggleSidebar()">
                <i class="pi pi-bars"></i>
            </button>
            <button class="toggle-btn mobile-only" (click)="closeMobileMenu()">
                <i class="pi pi-times"></i>
            </button>
        </div>

        <!-- ✅ MENÚ DINÁMICO -->
        <nav class="menu custom-scrollbar">
            <ng-container *ngFor="let group of menuGroups">
                <!-- Título del grupo de menú -->
                <div class="menu-label system pf-oswald" [class.mt-4]="group.label !== 'PRINCIPAL'">{{ group.label }}</div>
                
                <!-- Items del menú -->
                <a *ngFor="let item of group.items" class="menu-item" [routerLink]="item.route" routerLinkActive="active-link" (click)="closeMobileMenu()">
                    <i [class]="item.icon"></i>
                    <span class="label">{{ item.label }}</span>
                </a>
            </ng-container>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" (click)="logout()">
                <i class="pi pi-sign-out"></i>
                <span class="pf-oswald">CERRAR SESIÓN</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
                <i class="pi pi-bars"></i>
            </button>
            
            <div class="header-right">
                <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Oscuro'">
                    <i class="pi" [class.pi-moon]="!isDarkMode" [class.pi-sun]="isDarkMode"></i>
                </button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="name pf-oswald">{{ userName }}</span>
                        <span class="role">{{ userRole | titlecase }}</span>
                    </div>

                    <div class="avatar-container shadow-1">
                        <img *ngIf="userPhotoUrl" 
                            [src]="userPhotoUrl" 
                            alt="Perfil" 
                            class="avatar-img">

                        <div *ngIf="!userPhotoUrl" class="avatar-initials pf-anton">
                            {{ userInitial }}
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-content custom-scrollbar">
            <!-- AQUÍ RENDERIZAN LOS COMPONENTES HIJOS -->
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
