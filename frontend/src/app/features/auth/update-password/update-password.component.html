<p-toast position="top-right"></p-toast>

<div class="login-wrapper">
    <p-card styleClass="login-card">
        <div class="login-content">
            
            <div class="logo-section">
                <h2>Crear Nueva Contraseña</h2>
                <p class="subtitle">Ingresa una nueva contraseña segura para tu cuenta de ProFutbol.</p>
            </div>

            <!-- Formulario reactivo -->
            <form [formGroup]="updateForm" (ngSubmit)="actualizarPassword()" class="form-section">
                
                <div class="field">
                    <label>Nueva Contraseña</label>
                    <p-password 
                        formControlName="nuevaPassword" 
                        [toggleMask]="true" 
                        promptLabel="Ingresa una contraseña"
                        weakLabel="Débil"
                        mediumLabel="Media"
                        strongLabel="Fuerte"
                        placeholder="••••••••"
                        styleClass="w-full"
                        inputStyleClass="w-full p-3 custom-input">
                    </p-password>
                    <!-- Pequeño mensaje de validación visual -->
                    <small class="p-error block mt-1" *ngIf="updateForm.get('nuevaPassword')?.invalid && updateForm.get('nuevaPassword')?.touched">
                        Debe tener al menos 6 caracteres.
                    </small>
                </div>

                <div class="field mt-3">
                    <label>Confirmar Contraseña</label>
                    <p-password 
                        formControlName="confirmarPassword" 
                        [feedback]="false" 
                        [toggleMask]="true" 
                        placeholder="••••••••"
                        styleClass="w-full"
                        inputStyleClass="w-full p-3 custom-input">
                    </p-password>
                </div>

                <button pButton 
                        type="submit"
                        label="Guardar Contraseña" 
                        [loading]="loading"
                        icon="pi pi-save" 
                        class="btn-login w-full mt-4">
                </button>

                <div class="forgot-password mt-4 text-center">
                    <a class="cursor-pointer text-primary" (click)="irAlLogin()">Volver al Inicio de Sesión</a>
                </div>
            </form>
        </div>
    </p-card>
</div>
